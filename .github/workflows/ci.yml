name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: componenta/app
          ref: ${{ (github.head_ref == 'refactor/app-runtime-contracts' || github.ref_name == 'refactor/app-runtime-contracts') && 'refactor/app-runtime-contracts' || 'main' }}
          path: app-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Use App 6 source
        run: >-
          composer config repositories.app
          '{"type":"path","url":"app-source","options":{"symlink":false,"versions":{"componenta/app":"6.0.0"}}}'
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
